<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waranggono Cup 2026 — Team Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-stadium: #071318;
      --bg-surface: #0f232c;
      --bg-card: #132c37;
      --turf-green: #10b981;
      --turf-glow: rgba(16, 185, 129, 0.35);
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-stadium);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(245, 158, 11, 0.10) 0%, transparent 40%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 60px,
          transparent 60px,
          transparent 120px
        );
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 40px 20px 28px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, transparent 100%);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 240px; height: 240px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(16, 185, 129, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }

    .tournament-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(34px, 5.5vw, 58px);
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 20%, #a7f3d0 65%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .controls {
      max-width: 1240px;
      margin: 24px auto 30px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: var(--turf-green);
      box-shadow: 0 0 0 3px var(--turf-glow);
    }

    .btn-add-player {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #052e16;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--turf-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-add-player:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.45);
    }

    .btn-pdf-all {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-pdf-all:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.45);
    }

    .btn-pdf-all:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn:hover {
      border-color: rgba(16, 185, 129, 0.4);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--turf-green);
      color: #052e16;
      border-color: var(--turf-green);
      box-shadow: 0 4px 15px var(--turf-glow);
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .team-section {
      background: rgba(15, 35, 44, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 32px;
      backdrop-filter: blur(8px);
    }

    .team-header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(16, 185, 129, 0.25);
    }

    .team-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-shield {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--turf-green), #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 12px var(--turf-glow);
    }

    .team-title-wrap h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
    }

    .team-count {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.15);
      padding: 3px 10px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .team-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-quick-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-light);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quick-add:hover {
      background: var(--gold);
      color: #0f172a;
    }

    .btn-download-team {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-download-team:hover:not(:disabled) {
      background: var(--turf-green);
      color: #052e16;
      box-shadow: 0 4px 15px var(--turf-glow);
    }

    .btn-download-team:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(165deg, #183846 0%, #0d2029 100%);
      border-radius: 16px;
      padding: 8px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      cursor: zoom-in;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 158, 11, 0.25);
    }

    .card-inner {
      position: relative;
      border-radius: 11px;
      overflow: hidden;
      background: #08141a;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .card-num-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      background: rgba(7, 19, 24, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-zoom-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      background: rgba(7, 19, 24, 0.78);
      color: #fff;
      font-size: 12px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card:hover .card-zoom-hint {
      opacity: 1;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 118%;
      overflow: hidden;
      background: #0b1c24;
    }

    .card img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-img-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, #09171e 10%, transparent 100%);
      pointer-events: none;
    }

    .card-body {
      position: relative;
      padding: 10px 8px 12px;
      text-align: center;
      background: #09171e;
      border-top: 2px solid var(--turf-green);
    }

    .team-badge {
      display: inline-block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 3px;
    }

    .player-name {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(4, 11, 15, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .upload-modal {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      background: #0f232c;
      border: 1.5px solid rgba(16, 185, 129, 0.45);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      animation: fadeOverlay 0.2s ease;
    }

    .upload-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #09171e;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .upload-modal-header h3 {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #fff;
    }

    .upload-modal-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: #a7f3d0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #071318;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .form-group input[type="text"]:focus {
      border-color: var(--turf-green);
    }

    .batch-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(7, 19, 24, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
    }

    .batch-info {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .batch-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-batch-photos {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.14);
      color: var(--gold-light);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-batch-photos:hover {
      background: var(--gold);
      color: #0f172a;
    }

    .btn-add-row {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add-row:hover:not(:disabled) {
      background: var(--turf-green);
      color: #052e16;
    }

    .btn-add-row:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .player-rows-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-entry-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #08151b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .row-index-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-light);
      min-width: 28px;
      text-align: center;
    }

    .row-photo-btn {
      width: 50px;
      height: 58px;
      border-radius: 8px;
      border: 1.5px dashed rgba(16, 185, 129, 0.5);
      background: #0d2029;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .row-photo-btn:hover {
      border-color: var(--turf-green);
      color: #fff;
    }

    .row-photo-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .row-photo-btn span {
      font-size: 9px;
      font-weight: 700;
      margin-top: 2px;
    }

    .row-name-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .row-name-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0f232c;
      color: #fff;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }

    .row-name-input:focus {
      border-color: var(--turf-green);
    }

    .row-photo-status {
      font-size: 10.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-photo-status.ready {
      color: #6ee7b7;
    }

    .btn-remove-row {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-remove-row:hover {
      background: #ef4444;
      color: #fff;
    }

    .upload-status {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }

    .upload-status.error {
      display: block;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.4);
      color: #fca5a5;
    }

    .upload-status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .upload-actions {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-submit-upload {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: var(--turf-green);
      color: #052e16;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-submit-upload:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(4, 11, 15, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeOverlay 0.2s ease;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox-stage {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: linear-gradient(165deg, #132c37 0%, #09171e 100%);
      border: 2px solid var(--gold);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 158, 11, 0.2);
      display: flex;
      flex-direction: column;
    }

    .lightbox-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(7, 19, 24, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lightbox-event {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .lightbox-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .lightbox-close:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .lightbox-photo-area {
      position: relative;
      width: 100%;
      height: min(62vh, 520px);
      background: #061014;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lightbox-num {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #071318;
      border: 2px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 10px;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(7, 19, 24, 0.75);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

    .lightbox-prev { left: 12px; }

    .lightbox-info {

    .lightbox-team {

    #pdf-render-staging {
      position: fixed;
      left: 0;
      top: 0;

      z-index: -9999;

    .a4-sheet {

      background: #ffffff;

    .a4-team-name {
      font-family: 'Oswald', sans-serif;

    .a4-grid {

    .a4-card {

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

  </style>
</head>
<body>

  <header class="hero">
    <div class="tournament-tag">⚽ OFFICIAL TEAM ROSTER</div>
    <h1>WARANGGONO CUP 2026</h1>
    <p id="subtitle">Memuat data skuad tim...</p>
  </header>

  <div class="controls">
    <div class="top-bar">
      <div class="search-box">
        <input type="search" id="search" placeholder="🔍 Cari nama pemain...">
      </div>
      <button class="btn-add-player" onclick="openUploadModal('')">
        ➕ Tambah Pemain / Tim
      </button>
      <button class="btn-pdf-all" id="btn-export-all" onclick="downloadAllTeamsPDF()" disabled>
        📄 Download Semua Tim (PDF A4)
      </button>
    </div>
    <div class="tabs" id="team-tabs"></div>
  </div>

  <main class="container" id="content">
    <div class="msg">⏳ Menyiapkan data pemain Waranggono Cup 2026...</div>
  </main>

  <!-- MODAL MULTI-UPLOAD TIM, PEMAIN & FOTO -->
  <div class="modal-overlay" id="upload-modal" onclick="closeUploadOnBg(event)">
    <div class="upload-modal">
      <div class="upload-modal-header">
        <h3>➕ Input Data Pemain (Bisa Lebih dari 1)</h3>
        <button class="lightbox-close" onclick="closeUploadModal()" title="Tutup">✕</button>
      </div>
      <form class="upload-modal-body" id="upload-form" onsubmit="submitPlayersBatch(event)">
        <div class="form-group">
          <label for="input-tim">Nama Tim Peserta</label>
          <input type="text" id="input-tim" list="existing-teams-list" placeholder="Pilih tim atau ketik nama tim baru..." oninput="updateBatchSlotInfo()" required>
          <datalist id="existing-teams-list"></datalist>
        </div>

        <div class="batch-toolbar">
          <span class="batch-info" id="batch-slot-info">Antrean: 1 pemain</span>
          <div class="batch-btns">
            <input type="file" id="batch-photos-input" accept="image/*" multiple style="display:none" onchange="handleBatchPhotosSelect(event)">
            <button type="button" class="btn-batch-photos" onclick="document.getElementById('batch-photos-input').click()">
              🖼️ Pilih Banyak Foto Sekaligus
            </button>
            <button type="button" class="btn-add-row" id="btn-add-row" onclick="addPlayerRow()">
              + Baris Pemain
            </button>
          </div>
        </div>

        <div class="player-rows-list" id="player-rows-list"></div>

        <div class="upload-status" id="upload-status"></div>

        <div class="upload-actions">
          <button type="submit" class="btn-submit-upload" id="btn-submit-upload">
            💾 Simpan Semua ke Roster
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL / LIGHTBOX PRESENTASI PEMAIN -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightboxOnBg(event)">
    <div class="lightbox-stage">
      <div class="lightbox-top-bar">
        <span class="lightbox-event">⚽ WARANGGONO CUP 2026</span>
        <button class="lightbox-close" onclick="closeLightbox()" title="Tutup (Esc)">✕</button>
      </div>
      <div class="lightbox-photo-area">
        <span class="lightbox-num" id="lb-num">#01</span>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)" title="Sebelumnya (←)">‹</button>
        <img id="lb-img" src="" alt="Foto Pemain">
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)" title="Berikutnya (→)">›</button>
      </div>
      <div class="lightbox-info">
        <div class="lightbox-team" id="lb-team">NAMA TIM</div>
        <div class="lightbox-name" id="lb-name">NAMA PEMAIN</div>
        <div class="lightbox-counter" id="lb-counter">Pemain 1 dari 12 • Gunakan tombol panah ← → untuk geser</div>
      </div>
    </div>
  </div>

  <div id="pdf-render-staging"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw76jWvS7RMpu6FB-roFV2KlNYeHasWYPvMp5uw7SoxqtTrxoUDDM8O4_Ha9Yz2jV1V/exec';

    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">' +
      '<rect width="100%" height="100%" fill="#f3f4f6"/>' +
      '<circle cx="200" cy="175" r="65" fill="#d1d5db"/>' +
      '<path d="M95 390 C95 310, 305 310, 305 390" fill="#d1d5db"/>' +
      '<text x="50%" y="445" fill="#6b7280" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">NO PHOTO</text></svg>'
    );

    let allPlayers = [];
    let activeTeam = 'ALL';
    let draftRows = [];
    let nextRowId = 1;
    let currentTeamSquad = [];
    let currentSlideIndex = 0;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(message) {
      document.getElementById('subtitle').textContent = 'Gagal Memuat Data Turnamen';
      document.getElementById('content').innerHTML =
        `<div class="error-box">Gagal terhubung ke server.<br><small>${esc(message)}</small>` +
        `<br><button onclick="loadData()">Muat Ulang</button></div>`;
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getPlayers`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Respons tidak valid');

        allPlayers = json.data || [];
        const teams = [...new Set(allPlayers.map(p => p.tim || 'Tanpa Tim'))].sort();

        document.getElementById('subtitle').textContent =
          `${allPlayers.length} Pemain Terdaftar • ${teams.length} Tim Peserta (Klik foto untuk mode presentasi)`;

        document.getElementById('btn-export-all').disabled = allPlayers.length === 0;

        const datalist = document.getElementById('existing-teams-list');
        datalist.innerHTML = teams.map(t => `<option value="${esc(t)}">`).join('');

        renderTabs(teams);
        render();
      } catch (err) {
        showError(err.message);
      }
    }

    function renderTabs(teams) {
      const tabsContainer = document.getElementById('team-tabs');
      let html = `<button class="tab-btn ${activeTeam === 'ALL' ? 'active' : ''}" onclick="filterTeam('ALL', this)">Semua Tim (${teams.length})</button>`;

      teams.forEach(tim => {
        const isActive = activeTeam === tim ? 'active' : '';
        html += `<button class="tab-btn ${isActive}" onclick="filterTeam('${esc(tim)}', this)">${esc(tim)}</button>`;
      });

      tabsContainer.innerHTML = html;
    }

    function filterTeam(teamName, btn) {
      activeTeam = teamName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById('search').value = '';
      render();
    }

    function render() {
      const content = document.getElementById('content');
      const searchQuery = document.getElementById('search').value.toLowerCase().trim();

      let filtered = allPlayers;
      if (activeTeam !== 'ALL') {
        filtered = filtered.filter(d => (d.tim || 'Tanpa Tim') === activeTeam);
      }
      if (searchQuery) {
        filtered = filtered.filter(d => (d.nama || '').toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        content.innerHTML = '<div class="msg">Tidak ada pemain yang cocok dengan pencarian.</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(d => {
        const tim = d.tim || 'Tanpa Tim';
        (grouped[tim] = grouped[tim] || []).push(d);
      });

      let html = '';
      Object.keys(grouped).sort().forEach(tim => {
        const players = grouped[tim];
        const initials = tim.split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'FC';
        const isFull = players.length >= 12;

        html += `
          <section class="team-section">
            <div class="team-header-bar">
              <div class="team-title-wrap">
                <div class="team-shield">${esc(initials)}</div>
                <div>
                  <h2>${esc(tim)}</h2>
                  <span class="team-count">${players.length} / 12 Pemain</span>
                </div>
              </div>
              <div class="team-actions">
                ${!isFull ? `<button class="btn-quick-add" onclick="openUploadModal('${esc(tim)}')">➕ Tambah ke ${esc(tim)}</button>` : ''}
                <button class="btn-download-team" onclick="downloadSingleTeamPDF('${esc(tim)}', this)">
                  📥 Download PDF A4
                </button>
              </div>
            </div>
            <div class="grid">
              ${players.map((p, idx) => createCard(p, idx, tim)).join('')}
            </div>
          </section>
        `;
      });

      content.innerHTML = html;
    }

    function createCard(d, index, teamName) {
      const num = String(index + 1).padStart(2, '0');
      return `
        <div class="card" onclick="openLightbox('${esc(teamName)}', ${index})" title="Klik untuk perbesar foto presentasi">
          <div class="card-inner">
            <div class="card-num-badge">#${num}</div>
            <div class="card-zoom-hint">🔍</div>
            <div class="card-img-wrapper">
              <img src="${esc(d.fotoUrl || PLACEHOLDER)}"
                   alt="${esc(d.nama)}"
                   loading="lazy"
                   referrerpolicy="no-referrer"
                   onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
            </div>
            <div class="card-body">
              <div class="team-badge">${esc(d.tim || 'Tanpa Tim')}</div>
              <div class="player-name" title="${esc(d.nama)}">${esc(d.nama)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function getExistingTeamCount(teamName) {
      const key = String(teamName || '').trim().toLowerCase();
      if (!key) return 0;
      return allPlayers.filter(p => String(p.tim || '').trim().toLowerCase() === key).length;
    }

    function getMaxAllowedDraftRows(teamName) {
      const existing = getExistingTeamCount(teamName);
      return Math.max(1, 12 - existing);
    }

    function createBlankRow(prefillName = '') {
      return {
        id: nextRowId++,
        nama: prefillName,
        fotoDataUrl: '',
        fileLabel: '',
        metaText: 'Belum ada foto'
      };
    }

    function openUploadModal(prefillTeam) {
      const modal = document.getElementById('upload-modal');
      const timInput = document.getElementById('input-tim');
      const statusEl = document.getElementById('upload-status');

      statusEl.className = 'upload-status';
      statusEl.textContent = '';
      document.getElementById('batch-photos-input').value = '';

      if (prefillTeam) {
        timInput.value = prefillTeam;
      } else if (activeTeam !== 'ALL') {
        timInput.value = activeTeam;
      } else {
        timInput.value = '';
      }

      const maxAllowed = getMaxAllowedDraftRows(timInput.value);
      const initialCount = Math.min(2, maxAllowed);
      draftRows = Array.from({ length: initialCount }, () => createBlankRow());

      renderDraftRows();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeUploadOnBg(e) {
      if (e.target.id === 'upload-modal') closeUploadModal();
    }

    function addPlayerRow(prefillName = '') {
      const timVal = document.getElementById('input-tim').value;
      const maxAllowed = getMaxAllowedDraftRows(timVal);
      if (draftRows.length >= maxAllowed) return;

      draftRows.push(createBlankRow(prefillName));
      renderDraftRows();
    }

    function removePlayerRow(rowId) {
      if (draftRows.length <= 1) return;
      draftRows = draftRows.filter(r => r.id !== rowId);
      renderDraftRows();
    }

    function updateBatchSlotInfo() {
      const timVal = document.getElementById('input-tim').value.trim();
      const existing = getExistingTeamCount(timVal);
      const maxAllowed = getMaxAllowedDraftRows(timVal);

      if (draftRows.length > maxAllowed) {
        draftRows = draftRows.slice(0, maxAllowed);
        renderDraftRows();
        return;
      }

      const infoEl = document.getElementById('batch-slot-info');
      const addBtn = document.getElementById('btn-add-row');

      if (timVal) {
        infoEl.textContent = `Skuad "${timVal}": ${existing}/12 terisi • Antrean: ${draftRows.length} (Sisa kuota: ${maxAllowed})`;
      } else {
        infoEl.textContent = `Antrean: ${draftRows.length} pemain (Maks. 12/tim)`;
      }

      addBtn.disabled = draftRows.length >= maxAllowed;
    }

    function renderDraftRows() {
      const listEl = document.getElementById('player-rows-list');
      listEl.innerHTML = draftRows.map((row, idx) => {
        const num = String(idx + 1).padStart(2, '0');
        return `
          <div class="player-entry-row" data-row-id="${row.id}">
            <div class="row-index-badge">#${num}</div>
            <label class="row-photo-btn" title="Pilih foto pemain #${num}">
              <input type="file" accept="image/*" style="display:none" onchange="handleSingleRowPhoto(${row.id}, event)">
              ${row.fotoDataUrl
                ? `<img src="${row.fotoDataUrl}" alt="Foto ${num}">`
                : `<span style="font-size:16px;margin:0;">📸</span><span>FOTO</span>`}
            </label>
            <div class="row-name-wrap">
              <input type="text"
                     class="row-name-input"
                     placeholder="Nama pemain ke-${idx + 1}..."
                     value="${esc(row.nama)}"
                     oninput="onDraftNameInput(${row.id}, this.value)">
              <div class="row-photo-status ${row.fotoDataUrl ? 'ready' : ''}">${esc(row.metaText)}</div>
            </div>
            ${draftRows.length > 1
              ? `<button type="button" class="btn-remove-row" onclick="removePlayerRow(${row.id})" title="Hapus baris">✕</button>`
              : ''}
          </div>
        `;
      }).join('');

      updateBatchSlotInfo();
    }

    function onDraftNameInput(rowId, val) {
      const target = draftRows.find(r => r.id === rowId);
      if (target) target.nama = val;
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const MAX_WIDTH = 700;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            const approxKB = Math.round((dataUrl.length * 3) / 4 / 1024);
            resolve({
              dataUrl: dataUrl,
              metaText: `✓ ${file.name} (~${approxKB} KB)`
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleSingleRowPhoto(rowId, event) {
      const file = event.target.files[0];
      if (!file) return;
      const target = draftRows.find(r => r.id === rowId);
      if (!target) return;

      target.metaText = '⏳ Mengompres foto...';
      renderDraftRows();

      const compressed = await compressImageFile(file);
      target.fotoDataUrl = compressed.dataUrl;
      target.fileLabel = file.name;
      target.metaText = compressed.metaText;

      if (!target.nama.trim()) {
        target.nama = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
      }
      renderDraftRows();
    }

    async function handleBatchPhotosSelect(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const timVal = document.getElementById('input-tim').value;
      const maxAllowed = getMaxAllowedDraftRows(timVal);

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        let row = draftRows[i];

        if (!row) {
          if (draftRows.length < maxAllowed) {
            row = createBlankRow();
            draftRows.push(row);
          } else {
            break;
          }
        }

        const compressed = await compressImageFile(file);
        row.fotoDataUrl = compressed.dataUrl;
        row.fileLabel = file.name;
        row.metaText = compressed.metaText;

        if (!row.nama.trim()) {
          row.nama = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
        }
      }

      event.target.value = '';
      renderDraftRows();
    }

    async function uploadSinglePlayerItem(tim, playerItem) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          tim: tim,
          nama: playerItem.nama,
          fotoBase64: playerItem.fotoDataUrl || '',
          mimeType: 'image/jpeg'
        })
      });

      const result = await response.json();
      if (!result.success) {
        throw new Error(result.error || 'Gagal menyimpan data.');
      }
      return result;
    }

    async function submitPlayersBatch(event) {
      event.preventDefault();
      const tim = document.getElementById('input-tim').value.trim();
      const btn = document.getElementById('btn-submit-upload');
      const statusEl = document.getElementById('upload-status');

      const queue = draftRows
        .filter(r => (r.nama || '').trim().length > 0)
        .map(r => ({
          row: r,
          nama: r.nama.trim(),
          fotoDataUrl: r.fotoDataUrl || ''
        }));

      if (!tim || !queue.length) {
        statusEl.className = 'upload-status error';
        statusEl.textContent = '❌ Isi nama tim dan minimal 1 nama pemain.';
        return;
      }

      btn.disabled = true;
      statusEl.className = 'upload-status';
      statusEl.textContent = '';

      let successCount = 0;
      const failedNames = [];

      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        btn.textContent = `⏳ Mengupload ${i + 1}/${queue.length}: ${item.nama}...`;
        item.row.metaText = `⏳ Mengupload (${i + 1}/${queue.length})...`;
        renderDraftRows();

        try {
          await uploadSinglePlayerItem(tim, item);
          successCount++;
          item.row.metaText = '✅ Tersimpan ke Drive & Sheets';
        } catch (err) {
          failedNames.push(`${item.nama} (${err.message})`);
          item.row.metaText = `❌ Gagal: ${err.message}`;
        }
        renderDraftRows();
      }

      await loadData();

      if (failedNames.length === 0) {
        statusEl.className = 'upload-status success';
        statusEl.textContent = `✅ Selesai! ${successCount} dari ${queue.length} pemain berhasil diupload.`;
        const remaining = getMaxAllowedDraftRows(tim);
        draftRows = remaining > 0 ? [createBlankRow()] : [];
        renderDraftRows();
      } else {
        statusEl.className = 'upload-status error';
        statusEl.textContent = `⚠️ Berhasil ${successCount}/${queue.length}. Gagal: ${failedNames.join('; ')}`;
      }

      btn.disabled = false;
      btn.textContent = '💾 Simpan Semua ke Roster';
    }

    function openLightbox(teamName, index) {
      const searchQuery = document.getElementById('search').value.toLowerCase().trim();
      let list = allPlayers.filter(d => (d.tim || 'Tanpa Tim') === teamName);
      if (searchQuery) {
        list = list.filter(d => (d.nama || '').toLowerCase().includes(searchQuery));
      }
      if (!list.length) return;

      currentTeamSquad = list;
      currentSlideIndex = index >= 0 && index < list.length ? index : 0;
      updateLightboxView();

      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function updateLightboxView() {
      const p = currentTeamSquad[currentSlideIndex];
      const num = String(currentSlideIndex + 1).padStart(2, '0');

      const imgEl = document.getElementById('lb-img');
      imgEl.onerror = function() { this.onerror = null; this.src = PLACEHOLDER; };
      imgEl.referrerPolicy = 'no-referrer';
      const hdUrl = p.fileId ? `https://lh3.googleusercontent.com/d/${p.fileId}=w800` : (p.fotoUrl || PLACEHOLDER);
      imgEl.src = hdUrl;

      document.getElementById('lb-num').textContent = `#${num}`;
      document.getElementById('lb-team').textContent = p.tim || 'Tanpa Tim';
      document.getElementById('lb-name').textContent = p.nama || '-';
      document.getElementById('lb-counter').textContent =
        `Pemain ${currentSlideIndex + 1} dari ${currentTeamSquad.length} • Gunakan tombol panah ← → untuk geser`;
    }

    function navigateLightbox(step) {
      if (!currentTeamSquad.length) return;
      currentSlideIndex = (currentSlideIndex + step + currentTeamSquad.length) % currentTeamSquad.length;
      updateLightboxView();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeLightboxOnBg(e) {
      if (e.target.id === 'lightbox') closeLightbox();
    }

    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightbox');
      const up = document.getElementById('upload-modal');
      if (e.key === 'Escape') {
        if (lb.classList.contains('open')) closeLightbox();
        if (up.classList.contains('open')) closeUploadModal();
      }
      if (lb.classList.contains('open')) {
        if (e.key === 'ArrowRight') navigateLightbox(1);
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
      }
    });

    async function toSafeDataURL(url) {
      if (!url || url.startsWith('data:')) return url || PLACEHOLDER;
      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Fetch failed');
        const blob = await response.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => resolve(PLACEHOLDER);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return PLACEHOLDER;
      }
    }

    async function buildTeamA4Element(teamName, players) {
      const squad = players.slice(0, 12);
      const safePhotos = await Promise.all(squad.map(p => toSafeDataURL(p.fotoUrl)));

      const sheet = document.createElement('div');
      sheet.className = 'a4-sheet';

      const cardsHtml = squad.map((p, idx) => {
        const num = String(idx + 1).padStart(2, '0');
        return `
          <div class="a4-card">
            <div class="a4-card-num">#${num}</div>
            <div class="a4-photo-box">
              <img src="${safePhotos[idx]}" alt="${esc(p.nama)}">
            </div>
            <div class="a4-card-footer">
              <div class="a4-player-name">${esc(p.nama)}</div>
            </div>
          </div>
        `;
      }).join('');

      sheet.innerHTML = `
        <div class="a4-header">
          <div class="a4-header-left">
            <div class="a4-trophy-badge">CUP<br>2026</div>
            <div>
              <div class="a4-event-title">WARANGGONO CUP 2026 • OFFICIAL ROSTER</div>
              <div class="a4-team-name">${esc(teamName)}</div>
            </div>
          </div>
          <div class="a4-header-right">
            <div class="a4-squad-pill">SKUAD: ${squad.length} PEMAIN</div>
            <div class="a4-doc-label">Daftar Susunan Pemain (DSP)</div>
          </div>
        </div>

        <div class="a4-grid">
          ${cardsHtml}
        </div>

        <div class="a4-footer">
          <span><strong>WARANGGONO CUP 2026</strong> — Sepak Bola Usia Dini</span>
          <span>Dokumen Resmi Turnamen • Ukuran Cetak: A4 Portrait</span>
        </div>
      `;

      return sheet;
    }

    async function downloadSingleTeamPDF(teamName, btnElement) {
      const originalText = btnElement.innerHTML;
      btnElement.disabled = true;
      btnElement.innerHTML = '⏳ Menyiapkan PDF...';

      const staging = document.getElementById('pdf-render-staging');
      staging.innerHTML = '';
      staging.style.opacity = '1';

      try {
        const teamPlayers = allPlayers.filter(p => (p.tim || 'Tanpa Tim') === teamName);
        const sheet = await buildTeamA4Element(teamName, teamPlayers);
        staging.appendChild(sheet);

        await new Promise(r => setTimeout(r, 150));

        const safeFileName = `Roster_${teamName.replace(/[^a-zA-Z0-9_-]/g, '_')}_WaranggonoCup2026.pdf`;

        const opt = {
          margin: 0,
          filename: safeFileName,
          image: { type: 'jpeg', quality: 0.96 },
          html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, scrollX: 0 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        await html2pdf().set(opt).from(sheet).save();
      } catch (err) {
        alert('Gagal membuat PDF: ' + err.message);
      } finally {
        staging.style.opacity = '0';
        staging.innerHTML = '';
        btnElement.disabled = false;
        btnElement.innerHTML = originalText;
      }
    }

    async function downloadAllTeamsPDF() {
      const btn = document.getElementById('btn-export-all');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Merender Semua Tim...';

      const staging = document.getElementById('pdf-render-staging');
      staging.innerHTML = '';
      staging.style.opacity = '1';

      try {
        const grouped = {};
        allPlayers.forEach(d => {
          const tim = d.tim || 'Tanpa Tim';
          (grouped[tim] = grouped[tim] || []).push(d);
        });

        const teamNames = Object.keys(grouped).sort();
        const wrapper = document.createElement('div');

        for (let i = 0; i < teamNames.length; i++) {
          const tim = teamNames[i];
          btn.innerHTML = `⏳ Memproses Tim ${i + 1}/${teamNames.length}...`;
          const sheet = await buildTeamA4Element(tim, grouped[tim]);
          if (i < teamNames.length - 1) {
            sheet.style.pageBreakAfter = 'always';
          }
          wrapper.appendChild(sheet);
        }

        staging.appendChild(wrapper);
        await new Promise(r => setTimeout(r, 200));

        const opt = {
          margin: 0,
          filename: 'Semua_Tim_Waranggono_Cup_2026_A4_Portrait.pdf',
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, scrollX: 0 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };

        await html2pdf().set(opt).from(wrapper).save();
      } catch (err) {
        alert('Gagal membuat PDF gabungan: ' + err.message);
      } finally {
        staging.style.opacity = '0';
        staging.innerHTML = '';
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    document.getElementById('search').addEventListener('input', render);
    loadData();
  </script>
