<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waranggono Cup 2026 — Team Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- html2pdf.js untuk ekspor langsung ke file PDF A4 Portrait -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-stadium: #071318;
      --bg-surface: #0f232c;
      --bg-card: #132c37;
      --turf-green: #10b981;
      --turf-glow: rgba(16, 185, 129, 0.35);
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-stadium);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(245, 158, 11, 0.10) 0%, transparent 40%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 60px,
          transparent 60px,
          transparent 120px
        );
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* === HERO / HEADER TURNAMEN === */
    .hero {
      position: relative;
      text-align: center;
      padding: 40px 20px 28px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, transparent 100%);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 240px; height: 240px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(16, 185, 129, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }

    .tournament-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(34px, 5.5vw, 58px);
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.05;
      background: linear-gradient(135deg, #ffffff 20%, #a7f3d0 65%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* === CONTROLS & ACTION BAR === */
    .controls {
      max-width: 1240px;
      margin: 24px auto 30px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 440px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: var(--turf-green);
      box-shadow: 0 0 0 3px var(--turf-glow);
    }

    .btn-pdf-all {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-pdf-all:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.45);
    }

    .btn-pdf-all:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn:hover {
      border-color: rgba(16, 185, 129, 0.4);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--turf-green);
      color: #052e16;
      border-color: var(--turf-green);
      box-shadow: 0 4px 15px var(--turf-glow);
    }

    /* === CONTAINER & TEAM SECTION === */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .team-section {
      background: rgba(15, 35, 44, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 32px;
      backdrop-filter: blur(8px);
    }

    .team-header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(16, 185, 129, 0.25);
    }

    .team-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-shield {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--turf-green), #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 12px var(--turf-glow);
    }

    .team-title-wrap h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
    }

    .team-count {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.15);
      padding: 3px 10px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .btn-download-team {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-download-team:hover:not(:disabled) {
      background: var(--turf-green);
      color: #052e16;
      box-shadow: 0 4px 15px var(--turf-glow);
    }

    .btn-download-team:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* === PLAYER GRID (WEB VIEW) === */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }

    /* === TRADING CARD STYLE PLAYER CARD === */
    .card {
      background: linear-gradient(165deg, #183846 0%, #0d2029 100%);
      border-radius: 16px;
      padding: 8px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      cursor: zoom-in;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 158, 11, 0.25);
    }

    .card-inner {
      position: relative;
      border-radius: 11px;
      overflow: hidden;
      background: #08141a;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .card-num-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      background: rgba(7, 19, 24, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-zoom-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      background: rgba(7, 19, 24, 0.78);
      color: #fff;
      font-size: 12px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card:hover .card-zoom-hint {
      opacity: 1;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 118%;
      overflow: hidden;
      background: #0b1c24;
    }

    .card img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-img-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, #09171e 10%, transparent 100%);
      pointer-events: none;
    }

    .card-body {
      position: relative;
      padding: 10px 8px 12px;
      text-align: center;
      background: #09171e;
      border-top: 2px solid var(--turf-green);
    }

    .team-badge {
      display: inline-block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 3px;
    }

    .player-name {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================================
       LIGHTBOX / MODAL PRESENTASI PEMAIN (KLIK FOTO JADI BESAR)
       ========================================================================= */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(4, 11, 15, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeOverlay 0.2s ease;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lightbox-stage {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: linear-gradient(165deg, #132c37 0%, #09171e 100%);
      border: 2px solid var(--gold);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 158, 11, 0.2);
      display: flex;
      flex-direction: column;
    }

    .lightbox-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(7, 19, 24, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lightbox-event {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .lightbox-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .lightbox-close:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .lightbox-photo-area {
      position: relative;
      width: 100%;
      height: min(62vh, 520px);
      background: #061014;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lightbox-num {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #071318;
      border: 2px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 10px;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(7, 19, 24, 0.75);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .lightbox-nav:hover {
      background: var(--turf-green);
      color: #052e16;
      border-color: var(--turf-green);
    }

    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }

    .lightbox-info {
      padding: 18px 22px 20px;
      text-align: center;
      background: #09171e;
      border-top: 3px solid var(--turf-green);
    }

    .lightbox-team {
      display: inline-block;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #a7f3d0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .lightbox-name {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #ffffff;
      line-height: 1.1;
    }

    .lightbox-counter {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .msg, .error-box {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .error-box {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #fca5a5;
      border-radius: 16px;
    }

    .error-box button {
      margin-top: 14px;
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================================
       TEMPLATE A4 PORTRAIT HEMAT TINTA (210mm x 297mm — ANTI TERPOTONG)
       ========================================================================= */
    #pdf-render-staging {
      position: fixed;
      left: 0;
      top: 0;
      width: 210mm;
      z-index: -9999;
      opacity: 0;
      pointer-events: none;
    }

    .a4-sheet {
      width: 210mm;
      height: 292mm; /* Margin aman 5mm di bawah agar html2canvas tidak memotong footer */
      background: #ffffff;
      color: #111827;
      padding: 8mm 10mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .a4-header {
      height: 17mm;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      color: #111827;
      padding: 0 12px;
      border: 2px solid #111827;
      border-bottom: 3.5px solid #111827;
      border-radius: 6px;
    }

    .a4-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .a4-trophy-badge {
      background: #ffffff;
      color: #111827;
      border: 1.5px solid #111827;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 4px;
      text-align: center;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .a4-event-title {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #374151;
    }

    .a4-team-name {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      line-height: 1.1;
      color: #111827;
    }

    .a4-header-right {
      text-align: right;
    }

    .a4-squad-pill {
      display: inline-block;
      background: #f3f4f6;
      border: 1.5px solid #111827;
      color: #111827;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .a4-doc-label {
      font-size: 9px;
      color: #4b5563;
      margin-top: 3px;
      font-weight: 600;
    }

    /* Tinggi eksplisit 4 baris (58mm x 4 + gap 3mm x 3 = 241mm) agar kotak tidak melar/terpotong */
    .a4-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 58mm);
      gap: 3mm;
      margin: 4mm 0;
      flex-shrink: 0;
    }

    .a4-card {
      height: 58mm;
      background: #ffffff;
      border: 1.5px solid #374151;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .a4-card-num {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 3;
      background: #ffffff;
      color: #111827;
      font-family: 'Oswald', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1.5px solid #111827;
    }

    .a4-photo-box {
      height: 49mm;
      width: 100%;
      background: #f9fafb;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .a4-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Footer kartu nama tepat di bawah foto (tinggi 9mm) */
    .a4-card-footer {
      height: 9mm;
      flex-shrink: 0;
      background: #ffffff;
      color: #111827;
      padding: 0 5px;
      text-align: center;
      border-top: 1.5px solid #111827;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .a4-player-name {
      font-family: 'Oswald', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      line-height: 1.1;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .a4-footer {
      height: 6mm;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #374151;
      border-top: 1.5px solid #111827;
      padding-top: 3px;
      font-weight: 600;
    }

    .a4-footer strong {
      color: #111827;
    }

    /* === RESPONSIVE MOBILE === */
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .team-section { padding: 16px; }
      .team-title-wrap h2 { font-size: 20px; }
      .btn-download-team { width: 100%; justify-content: center; }
      .lightbox-nav { width: 38px; height: 38px; font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- HERO HEADER -->
  <header class="hero">
    <div class="tournament-tag">⚽ OFFICIAL TEAM ROSTER</div>
    <h1>WARANGGONO CUP 2026</h1>
    <p id="subtitle">Memuat data skuad tim...</p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="top-bar">
      <div class="search-box">
        <input type="search" id="search" placeholder="🔍 Cari nama pemain...">
      </div>
      <button class="btn-pdf-all" id="btn-export-all" onclick="downloadAllTeamsPDF()" disabled>
        📄 Download Semua Tim (PDF A4 Portrait)
      </button>
    </div>
    <div class="tabs" id="team-tabs"></div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="container" id="content">
    <div class="msg">⏳ Menyiapkan data pemain Waranggono Cup 2026...</div>
  </main>

  <!-- MODAL / LIGHTBOX PRESENTASI PEMAIN -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightboxOnBg(event)">
    <div class="lightbox-stage">
      <div class="lightbox-top-bar">
        <span class="lightbox-event">⚽ WARANGGONO CUP 2026</span>
        <button class="lightbox-close" onclick="closeLightbox()" title="Tutup (Esc)">✕</button>
      </div>
      <div class="lightbox-photo-area">
        <span class="lightbox-num" id="lb-num">#01</span>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)" title="Sebelumnya (←)">‹</button>
        <img id="lb-img" src="" alt="Foto Pemain">
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)" title="Berikutnya (→)">›</button>
      </div>
      <div class="lightbox-info">
        <div class="lightbox-team" id="lb-team">NAMA TIM</div>
        <div class="lightbox-name" id="lb-name">NAMA PEMAIN</div>
        <div class="lightbox-counter" id="lb-counter">Pemain 1 dari 12 • Gunakan tombol panah ← → untuk geser</div>
      </div>
    </div>
  </div>

  <!-- STAGING AREA UNTUK GENERATE PDF A4 PORTRAIT -->
  <div id="pdf-render-staging"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw76jWvS7RMpu6FB-roFV2KlNYeHasWYPvMp5uw7SoxqtTrxoUDDM8O4_Ha9Yz2jV1V/exec?action=getPlayers';

    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">' +
      '<rect width="100%" height="100%" fill="#f3f4f6"/>' +
      '<circle cx="200" cy="175" r="65" fill="#d1d5db"/>' +
      '<path d="M95 390 C95 310, 305 310, 305 390" fill="#d1d5db"/>' +
      '<text x="50%" y="445" fill="#6b7280" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">NO PHOTO</text></svg>'
    );

    let allPlayers = [];
    let activeTeam = 'ALL';

    // State untuk modal presentasi (lightbox)
    let currentTeamSquad = [];
    let currentSlideIndex = 0;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(message) {
      document.getElementById('subtitle').textContent = 'Gagal Memuat Data Turnamen';
      document.getElementById('content').innerHTML =
        `<div class="error-box">Gagal terhubung ke server.<br><small>${esc(message)}</small>` +
        `<br><button onclick="loadData()">Muat Ulang</button></div>`;
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (!json.success) throw new Error(json.error || 'Respons tidak valid');

        allPlayers = json.data || [];
        const teams = [...new Set(allPlayers.map(p => p.tim || 'Tanpa Tim'))];

        document.getElementById('subtitle').textContent =
          `${allPlayers.length} Pemain Terdaftar • ${teams.length} Tim Peserta (Klik foto untuk mode presentasi)`;

        document.getElementById('btn-export-all').disabled = allPlayers.length === 0;

        renderTabs(teams);
        render();
      } catch (err) {
        showError(err.message);
      }
    }

    function renderTabs(teams) {
      const tabsContainer = document.getElementById('team-tabs');
      let html = `<button class="tab-btn active" onclick="filterTeam('ALL', this)">Semua Tim (${teams.length})</button>`;

      teams.sort().forEach(tim => {
        html += `<button class="tab-btn" onclick="filterTeam('${esc(tim)}', this)">${esc(tim)}</button>`;
      });

      tabsContainer.innerHTML = html;
    }

    function filterTeam(teamName, btn) {
      activeTeam = teamName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('search').value = '';
      render();
    }

    function render() {
      const content = document.getElementById('content');
      const searchQuery = document.getElementById('search').value.toLowerCase().trim();

      let filtered = allPlayers;
      if (activeTeam !== 'ALL') {
        filtered = filtered.filter(d => (d.tim || 'Tanpa Tim') === activeTeam);
      }
      if (searchQuery) {
        filtered = filtered.filter(d => (d.nama || '').toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        content.innerHTML = '<div class="msg">Tidak ada pemain yang cocok dengan pencarian.</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(d => {
        const tim = d.tim || 'Tanpa Tim';
        (grouped[tim] = grouped[tim] || []).push(d);
      });

      let html = '';
      Object.keys(grouped).sort().forEach(tim => {
        const players = grouped[tim];
        const initials = tim.split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'FC';

        html += `
          <section class="team-section">
            <div class="team-header-bar">
              <div class="team-title-wrap">
                <div class="team-shield">${esc(initials)}</div>
                <div>
                  <h2>${esc(tim)}</h2>
                  <span class="team-count">${players.length} / 12 Pemain</span>
                </div>
              </div>
              <button class="btn-download-team" onclick="downloadSingleTeamPDF('${esc(tim)}', this)">
                📥 Download PDF A4 (${esc(tim)})
              </button>
            </div>
            <div class="grid">
              ${players.map((p, idx) => createCard(p, idx, tim)).join('')}
            </div>
          </section>
        `;
      });

      content.innerHTML = html;
    }

    function createCard(d, index, teamName) {
      const num = String(index + 1).padStart(2, '0');
      return `
        <div class="card" onclick="openLightbox('${esc(teamName)}', ${index})" title="Klik untuk perbesar foto presentasi">
          <div class="card-inner">
            <div class="card-num-badge">#${num}</div>
            <div class="card-zoom-hint">🔍</div>
            <div class="card-img-wrapper">
              <img src="${esc(d.fotoUrl || PLACEHOLDER)}"
                   alt="${esc(d.nama)}"
                   loading="lazy"
                   referrerpolicy="no-referrer"
                   onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
            </div>
            <div class="card-body">
              <div class="team-badge">${esc(d.tim || 'Tanpa Tim')}</div>
              <div class="player-name" title="${esc(d.nama)}">${esc(d.nama)}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       KONTROL LIGHTBOX / MODE PRESENTASI PEMAIN
       ========================================================================= */
    function openLightbox(teamName, index) {
      const searchQuery = document.getElementById('search').value.toLowerCase().trim();
      let list = allPlayers.filter(d => (d.tim || 'Tanpa Tim') === teamName);
      if (searchQuery) {
        list = list.filter(d => (d.nama || '').toLowerCase().includes(searchQuery));
      }
      if (!list.length) return;

      currentTeamSquad = list;
      currentSlideIndex = index >= 0 && index < list.length ? index : 0;
      updateLightboxView();

      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function updateLightboxView() {
      const p = currentTeamSquad[currentSlideIndex];
      const num = String(currentSlideIndex + 1).padStart(2, '0');

      const imgEl = document.getElementById('lb-img');
      imgEl.onerror = function() { this.onerror = null; this.src = PLACEHOLDER; };
      imgEl.referrerPolicy = 'no-referrer';
      imgEl.src = p.fotoUrl || PLACEHOLDER;

      document.getElementById('lb-num').textContent = `#${num}`;
      document.getElementById('lb-team').textContent = p.tim || 'Tanpa Tim';
      document.getElementById('lb-name').textContent = p.nama || '-';
      document.getElementById('lb-counter').textContent =
        `Pemain ${currentSlideIndex + 1} dari ${currentTeamSquad.length} • Gunakan tombol panah ← → untuk geser`;
    }

    function navigateLightbox(step) {
      if (!currentTeamSquad.length) return;
      currentSlideIndex = (currentSlideIndex + step + currentTeamSquad.length) % currentTeamSquad.length;
      updateLightboxView();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeLightboxOnBg(e) {
      if (e.target.id === 'lightbox') {
        closeLightbox();
      }
    }

    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') navigateLightbox(1);
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
    });

    /* =========================================================================
       KONVERSI GAMBAR KE DATA URL (BASE64) AGAR AMAN SAAT RENDER PDF (ANTI-CORS)
       ========================================================================= */
    async function toSafeDataURL(url) {
      if (!url || url.startsWith('data:')) return url || PLACEHOLDER;
      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Fetch failed');
        const blob = await response.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => resolve(PLACEHOLDER);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return PLACEHOLDER;
      }
    }

    /* =========================================================================
       MEMBANGUN HALAMAN A4 PORTRAIT HEMAT TINTA (3 KOLOM x 4 BARIS = 12 PEMAIN)
       ========================================================================= */
    async function buildTeamA4Element(teamName, players) {
      const squad = players.slice(0, 12);
      const safePhotos = await Promise.all(squad.map(p => toSafeDataURL(p.fotoUrl)));

      const sheet = document.createElement('div');
      sheet.className = 'a4-sheet';

      const cardsHtml = squad.map((p, idx) => {
        const num = String(idx + 1).padStart(2, '0');
        return `
          <div class="a4-card">
            <div class="a4-card-num">#${num}</div>
            <div class="a4-photo-box">
              <img src="${safePhotos[idx]}" alt="${esc(p.nama)}">
            </div>
            <div class="a4-card-footer">
              <div class="a4-player-name">${esc(p.nama)}</div>
            </div>
          </div>
        `;
      }).join('');

      sheet.innerHTML = `
        <div class="a4-header">
          <div class="a4-header-left">
            <div class="a4-trophy-badge">CUP<br>2026</div>
            <div>
              <div class="a4-event-title">WARANGGONO CUP 2026 • OFFICIAL ROSTER</div>
              <div class="a4-team-name">${esc(teamName)}</div>
            </div>
          </div>
          <div class="a4-header-right">
            <div class="a4-squad-pill">SKUAD: ${squad.length} PEMAIN</div>
            <div class="a4-doc-label">Daftar Susunan Pemain (DSP)</div>
          </div>
        </div>

        <div class="a4-grid">
          ${cardsHtml}
        </div>

        <div class="a4-footer">
          <span><strong>WARANGGONO CUP 2026</strong> — Sepak Bola Usia Dini</span>
          <span>Dokumen Resmi Turnamen • Ukuran Cetak: A4 Portrait</span>
        </div>
      `;

      return sheet;
    }

    /* =========================================================================
       DOWNLOAD PDF A4 PORTRAIT PER TIM
       ========================================================================= */
    async function downloadSingleTeamPDF(teamName, btnElement) {
      const originalText = btnElement.innerHTML;
      btnElement.disabled = true;
      btnElement.innerHTML = '⏳ Menyiapkan PDF...';

      const staging = document.getElementById('pdf-render-staging');
      staging.innerHTML = '';
      staging.style.opacity = '1';

      try {
        const teamPlayers = allPlayers.filter(p => (p.tim || 'Tanpa Tim') === teamName);
        const sheet = await buildTeamA4Element(teamName, teamPlayers);
        staging.appendChild(sheet);

        // Beri jeda singkat agar browser selesai menghitung layout & render gambar
        await new Promise(r => setTimeout(r, 150));

        const safeFileName = `Roster_${teamName.replace(/[^a-zA-Z0-9_-]/g, '_')}_WaranggonoCup2026.pdf`;

        const opt = {
          margin: 0,
          filename: safeFileName,
          image: { type: 'jpeg', quality: 0.96 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            logging: false,
            scrollY: 0,
            scrollX: 0
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        await html2pdf().set(opt).from(sheet).save();
      } catch (err) {
        alert('Gagal membuat PDF: ' + err.message);
      } finally {
        staging.style.opacity = '0';
        staging.innerHTML = '';
        btnElement.disabled = false;
        btnElement.innerHTML = originalText;
      }
    }

    /* =========================================================================
       DOWNLOAD PDF A4 PORTRAIT SEMUA TIM SEKALIGUS (1 TIM = 1 HALAMAN A4)
       ========================================================================= */
    async function downloadAllTeamsPDF() {
      const btn = document.getElementById('btn-export-all');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Merender Semua Tim...';

      const staging = document.getElementById('pdf-render-staging');
      staging.innerHTML = '';
      staging.style.opacity = '1';

      try {
        const grouped = {};
        allPlayers.forEach(d => {
          const tim = d.tim || 'Tanpa Tim';
          (grouped[tim] = grouped[tim] || []).push(d);
        });

        const teamNames = Object.keys(grouped).sort();
        const wrapper = document.createElement('div');

        for (let i = 0; i < teamNames.length; i++) {
          const tim = teamNames[i];
          btn.innerHTML = `⏳ Memproses Tim ${i + 1}/${teamNames.length}...`;
          const sheet = await buildTeamA4Element(tim, grouped[tim]);
          if (i < teamNames.length - 1) {
            sheet.style.pageBreakAfter = 'always';
          }
          wrapper.appendChild(sheet);
        }

        staging.appendChild(wrapper);
        await new Promise(r => setTimeout(r, 200));

        const opt = {
          margin: 0,
          filename: 'Semua_Tim_Waranggono_Cup_2026_A4_Portrait.pdf',
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            logging: false,
            scrollY: 0,
            scrollX: 0
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };

        await html2pdf().set(opt).from(wrapper).save();
      } catch (err) {
        alert('Gagal membuat PDF gabungan: ' + err.message);
      } finally {
        staging.style.opacity = '0';
        staging.innerHTML = '';
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    document.getElementById('search').addEventListener('input', render);
    loadData();
  </script>
</body>
</html>
